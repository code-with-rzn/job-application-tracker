<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Job Application Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Job Application Tracker</h1>
        <p>Track and manage your job applications in one place.</p>
    </header>


    <main>

        <!-- Dashboard -->
        <section id="dashboard">

            <h2>Dashboard</h2>

            <div>
                <h3>Total Applications</h3>
                <p>0</p>
            </div>

            <div>
                <h3>Applied</h3>
                <p>0</p>
            </div>

            <div>
                <h3>Interviews</h3>
                <p>0</p>
            </div>

            <div>
                <h3>Rejected</h3>
                <p>0</p>
            </div>

            <div>
                <h3>Offers</h3>
                <p>0</p>
            </div>

        </section>


        <!-- Add Application -->
        <section>

            <h2>Add Job Application</h2>

            <form id="applicationForm">

                <label for="company">
                    Company Name
                </label>

                <input
                    type="text"
                    id="company"
                    required
                >


                <label for="jobTitle">
                    Job Title
                </label>

                <input
                    type="text"
                    id="jobTitle"
                    required
                >


                <label for="location">
                    Location
                </label>

                <input
                    type="text"
                    id="location"
                    placeholder="e.g., Milwaukee, WI"
                >


                <label for="applicationDate">
                    Application Date
                </label>

                <input
                    type="date"
                    id="applicationDate"
                    required
                >


                <label for="salary">
                    Salary
                </label>

                <input
                    type="number"
                    id="salary"
                >


                <label for="status">
                    Status
                </label>

                <select id="status">

                    <option value="Applied">
                        Applied
                    </option>

                    <option value="Interview">
                        Interview
                    </option>

                    <option value="Rejected">
                        Rejected
                    </option>

                    <option value="Offer">
                        Offer
                    </option>

                </select>


                <button type="submit">
                    Add Application
                </button>

            </form>

        </section>


        <!-- Applications -->
        <section>

            <h2>Applications</h2>


            <!-- Search and Filter -->

            <div class="filters">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search company or job title..."
                >


                <select id="statusFilter">

                    <option value="All">
                        All Statuses
                    </option>

                    <option value="Applied">
                        Applied
                    </option>

                    <option value="Interview">
                        Interview
                    </option>

                    <option value="Rejected">
                        Rejected
                    </option>

                    <option value="Offer">
                        Offer
                    </option>

                </select>

            </div>


            <!-- Application Cards -->

            <div id="applicationsList"></div>

        </section>

    </main>


    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
